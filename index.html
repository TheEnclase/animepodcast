<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast Community Ranking Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
        <!-- Added normal vertical scroll support to prevent layout clipping when the submission form is visible -->
        <body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:py-4 md:px-6 font-sans overflow-y-auto">

        <div class="max-w-6xl mx-auto space-y-4">

        <!-- Header -->
        <header class="bg-slate-900 border border-slate-800 py-4 px-6 rounded-2xl flex items-center justify-between shadow-xl">
            <div class="space-y-0.5 text-left shrink-0">
                <h1 class="text-xl font-black tracking-wider text-cyan-400 uppercase font-mono leading-tight">My Top 10 Anime</h1>
                <p class="text-[11px] text-slate-400 font-medium">Erstelle deine persönliche Top 10 Liste und sende sie direkt ins Studio!</p>
            </div>
        </header>

        <!-- Action Bar (Top) -->
        <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl grid grid-cols-1 md:grid-cols-3 gap-3 shadow-xl">
            <button onclick="exportAsImage()" class="bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-black py-2 rounded-xl text-xs transition flex items-center justify-center gap-1.5 shadow-md">
                <i class="fa-solid fa-file-image text-sm"></i> Bild herunterladen (PNG)
            </button>
            <button onclick="exportShareCode()" class="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-black py-2 rounded-xl text-xs transition flex items-center justify-center gap-1.5 shadow-md">
                <i class="fa-solid fa-copy text-sm"></i> Share-Code kopieren
            </button>
            <button onclick="importShareCode()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-black py-2 rounded-xl text-xs transition flex items-center justify-center gap-1.5 shadow-md">
                <i class="fa-solid fa-file-import text-sm"></i> Code importieren (Laden)
            </button>
        </div>

        <!-- Main Workspace -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-5">

            <!-- Left Panel: Local Database Search -->
            <div class="md:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-lg flex flex-col h-[380px] md:h-[660px]">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 border-b border-slate-800 pb-1.5 flex items-center gap-2">
                    <i class="fa-solid fa-magnifying-glass text-cyan-400"></i> Mediathek durchsuchen
                </h2>

                <!-- Category Toggles -->
                <div class="flex bg-slate-950 p-1 rounded-lg border border-slate-800 gap-1 text-[11px] font-bold">
                    <button id="btn-type-anime" onclick="setIndexType('anime')" class="flex-1 py-1 rounded bg-cyan-600 text-slate-950 transition">Serien</button>
                    <button id="btn-type-character" onclick="setIndexType('character')" class="flex-1 py-1 rounded text-slate-400 hover:text-white transition">Charaktere</button>
                </div>

                <div class="space-y-2 text-xs">
                    <!-- Dynamic Filter Container -->
            <div id="filter-container" class="hidden grid grid-cols-2 gap-2 text-xs">
                <div>
                    <label class="block text-slate-500 mb-0.5 font-semibold text-[10px]">Jahr</label>
                    <select id="search-year" onchange="filterAndRenderResults()" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 focus:outline-none focus:border-cyan-500 text-white font-mono text-[11px]">
                        <!-- Populated dynamically -->
                    </select>
                </div>
                <div>
                    <label class="block text-slate-500 mb-0.5 font-semibold text-[10px]">Saison</label>
                    <select id="search-season-type" onchange="filterAndRenderResults()" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 focus:outline-none focus:border-cyan-500 text-white font-mono text-[11px]">
                        <option value="ALL">Alle Saisons</option>
                        <option value="Winter">Winter</option>
                        <option value="Spring">Spring</option>
                        <option value="Summer">Summer</option>
                        <option value="Fall">Fall</option>
                    </select>
                </div>
            </div>
                    <div>
                        <label class="block text-slate-500 mb-0.5 font-semibold">Titel suchen</label>
                        <input type="text" id="search-query" oninput="filterAndRenderResults()" placeholder="Titel tippen..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 focus:outline-none focus:border-cyan-500 text-white text-[11px]">
                    </div>
                </div>

                <!-- Results List -->
                <div id="results-list" class="flex-1 overflow-y-auto space-y-1.5 pr-1 text-xs">
                    <!-- Loaded dynamically -->
                </div>
            </div>

<!-- Right Panel: User's Top 10 Column -->
            <div class="md:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4 shadow-lg flex flex-col min-h-[660px]">
                <div class="flex items-center justify-between border-b border-slate-800 pb-1.5">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-list-ol text-cyan-400"></i> Meine Top 10 Liste
                    </h2>
                    <button onclick="clearList()" class="text-[9px] text-rose-400 hover:text-rose-300 font-bold uppercase tracking-wider transition">
                        <i class="fa-solid fa-trash-can mr-1"></i> Liste Leeren
                    </button>
                </div>

                <!-- 10 Slots -->
                <div id="slots-container" class="flex-1 space-y-1 pr-1 text-xs">
                    <!-- Dynamic slots rendered in JS -->
                </div>

                <!-- Inputs Container (Moved below the list!) -->
                <div class="border-t border-slate-800/80 pt-3 grid grid-cols-1 sm:grid-cols-3 gap-3 w-full">
                    <div>
                        <label class="block text-[9px] uppercase font-bold text-slate-500 mb-0.5 tracking-wider">Nickname</label>
                        <input type="text" id="viewer-name" placeholder="z.B. Enclase" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-[11px] text-white focus:outline-none focus:border-cyan-500 font-semibold transition">
                    </div>
                    <div>
                        <label class="block text-[9px] uppercase font-bold text-slate-500 mb-0.5 tracking-wider">Datum (optional)</label>
                        <input type="text" id="viewer-date" placeholder="z.B. 09.08.2026" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-[11px] text-white focus:outline-none focus:border-cyan-500 font-semibold transition">
                    </div>
                    <div>
                        <label class="block text-[9px] uppercase font-bold text-slate-500 mb-0.5 tracking-wider">Saison / Notiz (optional)</label>
                        <input type="text" id="viewer-note" placeholder="z.B. Sommer 2026" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-[11px] text-white focus:outline-none focus:border-cyan-500 font-semibold transition">
                    </div>
                </div>

                <!-- Dynamic Submission Panel (Positioned perfectly at the very bottom) -->
                <div id="viewer-submission-container" class="hidden bg-slate-950/40 border border-slate-900/60 p-4 rounded-xl space-y-3">
                    <div class="border-b border-slate-900/60 pb-1.5 flex items-center justify-between gap-4">
                        <div class="min-w-0">
                            <span class="px-1.5 py-0.5 bg-cyan-950 text-cyan-400 border border-cyan-500/20 text-[9px] font-black rounded uppercase tracking-wider">Einsendungsphase Aktiv</span>
                            <h3 id="submit-event-title" class="text-xs font-bold text-slate-200 mt-1 uppercase truncate"></h3>
                        </div>
                        <p id="submit-event-desc" class="text-[10px] text-slate-500 leading-tight text-right max-w-[240px] truncate"></p>
                    </div>

                    <!-- Submit Form -->
                    <div class="space-y-2 text-xs">
                        <div>
                            <label class="block text-slate-500 mb-0.5 text-[9px] uppercase font-bold tracking-wide">Kommentar zu deiner Liste (optional)</label>
                            <input type="text" id="viewer-comment-input" placeholder="z.B. Frieren ist unschlagbar!" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-[11px] text-white focus:outline-none focus:border-cyan-500 font-medium transition">
                        </div>
                        <button onclick="submitListToActiveEvent()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-black py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-1.5 shadow-lg">
                            <i class="fa-solid fa-cloud-arrow-up text-sm"></i> Liste an den Podcast senden
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Dynamic Attribution Footer -->
        <footer class="text-center text-xs text-slate-500 font-mono tracking-wide pt-2 pb-4 space-y-2">
            <div class="flex items-center justify-center gap-2">
                <span class="text-cyan-400 font-black">S-RANK</span>
                <span class="text-slate-600">|</span>
                <span class="text-slate-400">Der Anime Podcast</span>
            </div>
            <div class="text-[11px] text-slate-400">
                Sende uns deinen Share-Code auf unserem <a href="https://discord.com/invite/Tub9Wqd" target="_blank" rel="noopener noreferrer" class="text-indigo-400 hover:text-indigo-300 font-bold transition-all underline decoration-dotted"><i class="fa-brands fa-discord mr-1"></i>Discord-Server</a>!
            </div>
            <div class="text-[9px] text-slate-600 pt-1">
                Anime data provided by <a href="https://anilist.co" target="_blank" rel="noopener noreferrer" class="text-cyan-500/50 hover:text-cyan-400 underline transition-colors duration-200">AniList.co</a>
            </div>
        </footer>

    </div>

    <!-- Hidden Canvas for Image Export -->
    <canvas id="export-canvas" style="display: none;"></canvas>

    <script>
        let activeIndexType = 'anime';

        function setIndexType(type) {
            activeIndexType = type;
            const btnAnime = document.getElementById('btn-type-anime');
            const btnChar = document.getElementById('btn-type-character');
            const filterContainer = document.getElementById('filter-container');

            if (type === 'anime') {
                btnAnime.className = "flex-1 py-1 rounded bg-cyan-600 text-slate-950 transition";
                btnChar.className = "flex-1 py-1 rounded text-slate-400 hover:text-white transition";
                filterContainer.style.display = 'grid';
            } else {
                btnAnime.className = "flex-1 py-1 rounded text-slate-400 hover:text-white transition";
                btnChar.className = "flex-1 py-1 rounded bg-cyan-600 text-slate-950 transition";
                filterContainer.style.display = 'none'; // Season filters don't apply to characters
            }
            filterAndRenderResults();
        }

        let myRanking = Array(10).fill(null);
        let localSeasonalCache = [];

        window.addEventListener('DOMContentLoaded', () => {
            renderSlots();
            loadSeasonData();
        });

function importShareCode() {
            const code = prompt("Füge deinen Share-Code hier ein, um deine Liste zu laden:");
            if (!code) return;

            try {
                // Decode base64 securely
                const data = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));

                const name = data.n || data.name || "";
                const idList = data.l || (data.list ? data.list.map(item => item.id) : []);

                if (idList.length === 0) throw new Error("Liste ist leer");

                // Populate Name Metadata
                document.getElementById('viewer-name').value = name;

                // Reset ranking array
                myRanking = Array(10).fill(null);

                idList.forEach((id, index) => {
                    if (index < 10 && id) {
                        const match = localSeasonalCache.find(a => a.id === id);
                        if (match) {
                            myRanking[index] = match;
                        } else {
                            // Stub placeholder if the character/series is not loaded in the current viewer cache
                            myRanking[index] = {
                                id: id,
                                title: "Importierter Titel",
                                image: "https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=300"
                            };
                        }
                    }
                });

                renderSlots();
                alert("Deine Liste wurde erfolgreich geladen!");

            } catch (err) {
                alert("Fehler beim Importieren: Ungültiger oder beschädigter Code.");
                console.error(err);
            }
        }
        
        function renderSlots() {
            const container = document.getElementById('slots-container');
            container.innerHTML = '';

            for (let i = 0; i < 10; i++) {
                const anime = myRanking[i];
                const slotDiv = document.createElement('div');
                slotDiv.className = "flex items-center gap-2 p-1 bg-slate-950/40 border border-slate-900 rounded-xl h-[48px]";

                const rankText = i === 0 ? 'S' : (i + 1);

                let slotContent = `
                    <div class="w-7 h-7 rounded-lg bg-slate-900 border border-slate-800 text-slate-400 font-black flex items-center justify-center text-[10px] shrink-0">${rankText}</div>
                    <div class="flex-1 text-slate-600 font-bold tracking-wider text-[9px] uppercase text-center border border-dashed border-slate-800/60 rounded-lg py-2">Leer</div>
                `;

                if (anime) {
                    slotContent = `
                        <div class="w-7 h-7 rounded-lg bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 font-black flex items-center justify-center text-[10px] shrink-0">${rankText}</div>
                        <img src="${anime.image}" class="w-[24px] h-[34px] object-cover rounded shrink-0 bg-slate-900 shadow">
                        <p class="flex-1 font-bold text-slate-200 truncate pr-1 text-[11px] leading-tight">${anime.title}</p>
                        <div class="flex items-center gap-1 pr-1">
                            <button onclick="moveItem(${i}, -1)" class="w-5 h-5 rounded bg-slate-900 hover:bg-slate-800 text-slate-400 flex items-center justify-center"><i class="fa-solid fa-caret-up text-[10px]"></i></button>
                            <button onclick="moveItem(${i}, 1)" class="w-5 h-5 rounded bg-slate-900 hover:bg-slate-800 text-slate-400 flex items-center justify-center"><i class="fa-solid fa-caret-down text-[10px]"></i></button>
                            <button onclick="removeItem(${i})" class="w-5 h-5 rounded bg-rose-950/40 hover:bg-rose-900/60 text-rose-400 ml-0.5 flex items-center justify-center"><i class="fa-solid fa-xmark text-[10px]"></i></button>
                        </div>
                    `;
                }

                slotDiv.innerHTML = slotContent;
                container.appendChild(slotDiv);
            }
        }

        function getSeasonWeight(seasonStr) {
            const parts = seasonStr.trim().toUpperCase().split(/\s+/);
            if (parts.length < 2) return 0;

            const season = parts[0];
            const year = parseInt(parts[1]) || 0;

            let seasonVal = 0;
            if (season === "WINTER") seasonVal = 1;
            else if (season === "SPRING") seasonVal = 2;
            else if (season === "SUMMER") seasonVal = 3;
            else if (season === "FALL") seasonVal = 4;

            return (year * 10) + seasonVal;
        }

        const SUPABASE_URL = "https://zrtkaoywmvjbvazfxbjc.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable__pk9A4rDxaG_-_UB2KiIEA_QtdXVqJ_";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let activeEvent = null;

        // Check for active submission phases on load
        window.addEventListener('DOMContentLoaded', checkActiveEvent);

        async function checkActiveEvent() {
            try {
                const { data, error } = await supabaseClient
                    .from('events')
                    .select('*')
                    .eq('status', 'active')
                    .maybeSingle();

                if (error) throw error;

                const submitContainer = document.getElementById('viewer-submission-container');
                if (data) {
                    activeEvent = data;
                    submitContainer.classList.remove('hidden');
                    document.getElementById('submit-event-title').textContent = data.title;
                    document.getElementById('submit-event-desc').textContent = data.description;
                } else {
                    activeEvent = null;
                    submitContainer.classList.add('hidden'); // Hide the submission interface entirely
                }
            } catch (err) {
                console.error("Fehler beim Prüfen aktiver Phasen:", err);
            }
        }

        async function submitListToActiveEvent() {
            if (!activeEvent) {
                alert("Derzeit läuft keine aktive Einsendungsphase.");
                return;
            }

            const nameInput = document.getElementById('viewer-name');
            const commentInput = document.getElementById('viewer-comment-input');

            const name = nameInput.value.trim();
            const comment = commentInput.value.trim();

            if (!name) {
                alert("Bitte gib zuerst deinen Nicknamen oben im Kopfbereich ein!");
                nameInput.focus();
                return;
            }

            const listData = myRanking.filter(item => item !== null);
            if (listData.length === 0) {
                alert("Deine Liste ist leer!");
                return;
            }

            // Compile the Top 10 code in background
            const payload = { n: name, l: listData.map(item => item.id) };
            const base64Code = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));

            try {
                const { error } = await supabaseClient
                    .from('submissions')
                    .insert([{
                        event_id: activeEvent.id,
                        name: name,
                        share_code: base64Code,
                        comment: comment || null
                    }]);

                if (error) throw error;

                commentInput.value = '';
                alert("Erfolgreich eingereicht! Deine Liste wurde an das Podcast-Studio übertragen.");

            } catch (err) {
                console.error(err);
                alert("Fehler bei der Übertragung der Liste. Bitte versuche es erneut.");
            }
        }

        async function loadSeasonData() {
            const list = document.getElementById('results-list');
            list.innerHTML = `<div class="text-slate-500 text-center py-20"><i class="fa-solid fa-spinner animate-spin text-lg mr-2 text-cyan-400"></i>Lade Datenbank...</div>`;

            try {
                const response = await fetch('anime_data.json?v=' + Date.now());
                if (!response.ok) throw new Error("File not found");

                let rawData = await response.json();

                // Compatibility layer: Default legacy items to 'anime'
                localSeasonalCache = rawData.map(item => {
                    if (!item.type) item.type = 'anime';
                    return item;
                });

                // Sort out and aggregate all distinct years
                const years = new Set();
                localSeasonalCache.forEach(anime => {
                    if (anime.type === 'anime' && anime.season) {
                        const parts = anime.season.trim().split(/\s+/);
                        if (parts.length >= 2) {
                            const yr = parseInt(parts[1]);
                            if (yr) years.add(yr);
                        }
                    }
                });

                const sortedYears = [...years].sort((a, b) => b - a);

                const yearSelect = document.getElementById('search-year');
                yearSelect.innerHTML = '<option value="ALL">Alle Jahre</option>';

                sortedYears.forEach(yr => {
                    const opt = document.createElement('option');
                    opt.value = yr;
                    opt.textContent = yr;
                    yearSelect.appendChild(opt);
                });

                document.getElementById('filter-container').classList.remove('hidden');
                filterAndRenderResults();

            } catch (err) {
                console.error(err);
                list.innerHTML = `
                    <div class="text-rose-400 text-center py-10 space-y-2">
                        <i class="fa-solid fa-circle-exclamation text-xl"></i>
                        <p class="font-bold text-xs">Datenbank-Datei (anime_data.json) nicht gefunden!</p>
                        <p class="text-[10px] text-slate-500 max-w-sm mx-auto">Die Moderatoren müssen zuerst eine 'anime_data.json' Datei erstellen und sie in das GitHub Repository hochladen.</p>
                    </div>
                `;
            }
        }

        function filterAndRenderResults() {
            const list = document.getElementById('results-list');
            const queryText = document.getElementById('search-query').value.toLowerCase().trim();
            const selectedYear = document.getElementById('search-year')?.value || 'ALL';
            const selectedSeasonType = document.getElementById('search-season-type')?.value || 'ALL';

            // PERFORMANCE TRICK: Do not load full sets by default
            if (activeIndexType === 'anime' && selectedYear === 'ALL' && selectedSeasonType === 'ALL' && !queryText) {
                list.innerHTML = `
                    <div class="text-center py-20 text-slate-500 text-xs">
                        <i class="fa-solid fa-magnifying-glass text-cyan-400/50 text-xl mb-2 block"></i>
                        Filtern Sie nach Jahr/Saison oder geben Sie einen Suchbegriff ein.
                    </div>
                `;
                return;
            }
            if (activeIndexType === 'character' && !queryText) {
                list.innerHTML = `
                    <div class="text-center py-20 text-slate-500 text-xs">
                        <i class="fa-solid fa-user text-cyan-400/50 text-xl mb-2 block"></i>
                        Geben Sie einen Namen ein, um Charaktere zu suchen.
                    </div>
                `;
                return;
            }

            const filtered = localSeasonalCache.filter(anime => {
                // Filter by active type
                const itemType = anime.type || 'anime';
                if (itemType !== activeIndexType) return false;

                let matchesYear = true;
                let matchesSeasonType = true;

                if (activeIndexType === 'anime') {
                    if (anime.season) {
                        const parts = anime.season.trim().split(/\s+/);
                        const sType = parts[0] || "";
                        const sYear = parts[1] || "";

                        if (selectedYear !== 'ALL' && sYear !== selectedYear) {
                            matchesYear = false;
                        }
                        if (selectedSeasonType !== 'ALL' && sType.toLowerCase() !== selectedSeasonType.toLowerCase()) {
                            matchesSeasonType = false;
                        }
                    } else {
                        if (selectedYear !== 'ALL' || selectedSeasonType !== 'ALL') {
                            matchesYear = false;
                            matchesSeasonType = false;
                        }
                    }
                }

                const matchesQuery = (!queryText || anime.title.toLowerCase().includes(queryText));
                return matchesYear && matchesSeasonType && matchesQuery;
            });

            list.innerHTML = '';
            if (filtered.length === 0) {
                list.innerHTML = `<div class="text-slate-500 text-center py-20">Keine Treffer gefunden.</div>`;
                return;
            }

            // Cap the visual rendering at 100 elements to prevent DOM lagging
            const maxResults = 100;
            const toRender = filtered.slice(0, maxResults);

            toRender.forEach(anime => {
                const item = document.createElement('div');
                item.className = "bg-slate-950 p-1.5 rounded-xl flex items-center gap-2 border border-slate-800 hover:border-cyan-500 transition cursor-pointer group h-[52px]";
                item.onclick = () => addAnimeToList(anime);
                item.innerHTML = `
                    <img src="${anime.image}" class="w-[24px] h-[34px] object-cover rounded shrink-0 bg-slate-900 shadow shadow-md">
                    <div class="flex-1 min-w-0">
                        <p class="font-bold line-clamp-2 text-slate-300 group-hover:text-cyan-400 leading-tight text-[11px]">${anime.title}</p>
                    </div>
                    <button class="bg-cyan-950 text-cyan-400 hover:bg-cyan-900 w-5 h-5 rounded flex items-center justify-center shrink-0 ml-1"><i class="fa-solid fa-plus text-[10px]"></i></button>
                `;
                list.appendChild(item);
            });

            if (filtered.length > maxResults) {
                const moreItem = document.createElement('div');
                moreItem.className = "text-center py-2 text-slate-500 text-[10px] italic border-t border-slate-900 mt-2";
                moreItem.textContent = `... und ${filtered.length - maxResults} weitere Treffer (Suche präzisieren)`;
                list.appendChild(moreItem);
            }
        }

        function addAnimeToList(anime) {
            if (myRanking.some(item => item && item.id === anime.id)) return;

            const index = myRanking.indexOf(null);
            if (index !== -1) {
                myRanking[index] = anime;
                renderSlots();
            } else {
                alert("Deine Top 10 Liste ist bereits voll!");
            }
        }

        function removeItem(idx) {
            myRanking[idx] = null;
            renderSlots();
        }

        function moveItem(idx, direction) {
            const target = idx + direction;
            if (target < 0 || target > 9) return;

            const temp = myRanking[target];
            myRanking[target] = myRanking[idx];
            myRanking[idx] = temp;
            renderSlots();
        }

        function clearList() {
            if (confirm("Möchtest du die gesamte Liste leeren?")) {
                myRanking = Array(10).fill(null);
                renderSlots();
            }
        }

        function exportShareCode() {
            const nameInput = document.getElementById('viewer-name');
            const name = nameInput.value.trim();
            if (!name) {
                alert("Bitte gib zuerst deinen Namen im Kopfbereich ein!");
                nameInput.focus();
                return;
            }

            const listData = myRanking.filter(item => item !== null);
            if (listData.length === 0) {
                alert("Deine Liste ist leer!");
                return;
            }

            const payload = { n: name, l: listData.map(item => item.id) };
            const base64Code = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));

            navigator.clipboard.writeText(base64Code).then(() => {
                alert("Kopiert! Sende diesen Code jetzt per Nachricht an die Podcast-Moderatoren.");
            }).catch(err => {
                alert("Kopieren fehlgeschlagen: " + base64Code);
            });
        }

        function loadImage(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = src;
            });
        }

        async function exportAsImage() {
            const nameInput = document.getElementById('viewer-name');
            const name = nameInput.value.trim() || "Anonym";

            const listData = myRanking.filter(item => item !== null);
            if (listData.length === 0) {
                alert("Deine Liste ist leer!");
                return;
            }

            const canvas = document.getElementById('export-canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = 500;
            canvas.height = 850;

            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 4;
            ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

            ctx.fillStyle = '#22d3ee';
            ctx.font = '900 24px monospace';
            ctx.textAlign = 'center';
            ctx.fillText("MY ANIME TOP 10", canvas.width / 2, 45);

            ctx.fillStyle = '#f1f5f9';
            ctx.font = 'bold 13px sans-serif';
            ctx.fillText(`by ${name}`, canvas.width / 2, 68);

            const dateVal = document.getElementById('viewer-date').value.trim();
            const noteVal = document.getElementById('viewer-note').value.trim();

            let metaString = "";
            if (dateVal && noteVal) {
                metaString = `${dateVal}  |  ${noteVal}`;
            } else if (dateVal) {
                metaString = dateVal;
            } else if (noteVal) {
                metaString = noteVal;
            }

            if (metaString) {
                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 11px monospace';
                ctx.fillText(metaString.toUpperCase(), canvas.width / 2, 88);
            }

            const imagePromises = listData.map(item => loadImage(item.image));
            const loadedImages = await Promise.all(imagePromises);

            const startY = 115;
            const rowHeight = 70;

            for (let i = 0; i < 10; i++) {
                const y = startY + (i * rowHeight);

                ctx.fillStyle = '#090d16';
                ctx.fillRect(25, y, canvas.width - 50, 60);

                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 1;
                ctx.strokeRect(25, y, canvas.width - 50, 60);

                ctx.fillStyle = '#1e293b';
                ctx.fillRect(30, y + 10, 40, 40);

                if (i === 0) {
                    ctx.fillStyle = '#fbbf24';
                    ctx.font = '900 18px monospace';
                } else {
                    ctx.fillStyle = '#38bdf8';
                    ctx.font = 'bold 16px sans-serif';
                }

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(i === 0 ? 'S' : `${i + 1}`, 50, y + 30);

                const anime = listData[i];
                if (anime) {
                    const img = loadedImages[i];
                    if (img) {
                        ctx.drawImage(img, 85, y + 5, 34, 50);
                    }

                    ctx.fillStyle = '#f1f5f9';
                    ctx.font = 'bold 13px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';

                    let displayTitle = anime.title;
                    if (ctx.measureText(displayTitle).width > 310) {
                        while (ctx.measureText(displayTitle + '...').width > 310) {
                            displayTitle = displayTitle.slice(0, -1);
                        }
                        displayTitle += '...';
                    }
                    ctx.fillText(displayTitle, 135, y + 30);
                } else {
                    ctx.fillStyle = '#334155';
                    ctx.font = 'bold italic 13px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';
                    ctx.fillText("LEER", 135, y + 30);
                }
            }

            const link = document.createElement('a');
            link.download = `${name.replace(/[^a-z0-9]/gi, '_')}_top_10.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
